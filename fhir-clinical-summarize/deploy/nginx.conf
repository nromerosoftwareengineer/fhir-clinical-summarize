# Plain HTTP. Works as soon as the stack is up, with no certificates and no DNS
# record -- browse to the VM's public IP. Fine for synthetic data; swap in
# nginx-tls.conf before anything real.

server {
    listen 80;
    server_name _;

    # Allow for the certbot HTTP-01 challenge, so TLS can be added later
    # without taking the site down.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # The dashboard and the API.
    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A packet makes one model call, and CPU inference takes 10-30s. The
        # 60s default would kill the request on the busiest patients.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Read-only FHIR passthrough so the dashboard's citation links resolve: a
    # reviewer clicks "Condition/abc123" and lands on the record itself, which
    # is the whole point of the source field.
    location /fhir/ {
        proxy_pass http://hapi-fhir:8080/fhir/;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Browsing records is the point; writing them is not. Even with
        # synthetic data, a world-writable FHIR server is not worth the risk.
        limit_except GET HEAD {
            deny all;
        }
    }

    # Ollama is never exposed. It has no auth of any kind, and an open
    # inference endpoint is someone else's free compute.
}
