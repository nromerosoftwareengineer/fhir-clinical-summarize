# HTTPS. Use this once certbot has issued certificates for DOMAIN and
# /etc/letsencrypt is mounted into the container:
#
#   NGINX_CONF=./deploy/nginx-tls.conf \
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d nginx
#
# Replace DOMAIN below with the real hostname in both blocks.

server {
    listen 80;
    server_name DOMAIN;

    # Keep the challenge path on HTTP so renewals work without downtime.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # One model call per packet, 10-30s on CPU.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Read-only FHIR passthrough, so citation links resolve.
    location /fhir/ {
        proxy_pass http://hapi-fhir:8080/fhir/;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_except GET HEAD {
            deny all;
        }
    }
}
