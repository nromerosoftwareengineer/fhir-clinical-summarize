<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Patient Search</title>

<!--
  A single-file React dashboard for the patient search API.

  Served by FastAPI itself at http://localhost:8000/ui/ so it is same-origin
  with the API: no CORS, and no mixed-content problem talking to a local
  http:// backend. React and Babel come from a CDN, so there is no build step
  and no node_modules in the repo.

  Every field below maps to a real FHIR Patient search parameter, taken from the
  server's own CapabilityStatement. Blank fields are dropped before the request,
  so any subset works: fill in one field or six.
-->

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --border: #dfe3e8;
    --text: #1a1d21;
    --muted: #666d78;
    --accent: #2f6f9f;
    --accent-soft: #e8f1f8;
    --danger: #a13d3d;
    --danger-soft: #fbeceb;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181c;
      --surface: #1d2025;
      --border: #30353c;
      --text: #e6e8ea;
      --muted: #9aa2ac;
      --accent: #74b2dd;
      --accent-soft: #223240;
      --danger: #e09a96;
      --danger-soft: #3a2422;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15181c;
    --surface: #1d2025;
    --border: #30353c;
    --text: #e6e8ea;
    --muted: #9aa2ac;
    --accent: #74b2dd;
    --accent-soft: #223240;
    --danger: #e09a96;
    --danger-soft: #3a2422;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  header { margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 18px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
  }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  label code { font-weight: 400; font-size: 11px; opacity: 0.75; }
  input, select {
    width: 100%;
    padding: 8px 10px;
    font: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .born { display: grid; grid-template-columns: 90px 1fr; gap: 6px; }

  .actions { display: flex; gap: 10px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 14px; font-weight: 500;
    padding: 8px 16px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: 0.55; cursor: default; }

  .query {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; color: var(--muted);
    word-break: break-all; margin-top: 12px;
    padding: 8px 10px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    text-align: left; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--muted);
    padding: 0 10px 8px; border-bottom: 1px solid var(--border);
  }
  td { padding: 9px 10px; border-bottom: 1px solid var(--border); }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--accent-soft); }
  tbody tr.sel { background: var(--accent-soft); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); }

  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .count { font-size: 13px; color: var(--muted); }
  .pager { display: flex; gap: 8px; align-items: center; }

  .err {
    background: var(--danger-soft); border: 1px solid var(--danger);
    color: var(--danger); padding: 12px 14px; border-radius: var(--radius);
    font-size: 14px; margin-bottom: 18px;
  }
  .err ul { margin: 8px 0 0; padding-left: 20px; font-size: 12px; }

  .detail { display: grid; grid-template-columns: 110px 1fr; gap: 8px 14px; font-size: 14px; }
  .detail dt { color: var(--muted); font-size: 12px; font-weight: 600; padding-top: 2px; }
  .detail dd { margin: 0; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 28px 0; }
  @media (max-width: 620px) {
    .hide-sm { display: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useCallback } = React;

// The API is served from the same origin as this page.
const API = "";

// Each field maps to a FHIR Patient search parameter. `param` is the real
// parameter name sent to the server; `hint` shows it in the UI so the form
// doubles as documentation of the API underneath.
const FIELDS = [
  { param: "name",         label: "Name",        placeholder: "Akiko" },
  { param: "family",       label: "Family name", placeholder: "Runte676" },
  { param: "given",        label: "Given name",  placeholder: "Akiko835" },
  { param: "identifier",   label: "MRN",         placeholder: "792be1e3-..." },
  { param: "address",      label: "Location",    placeholder: "Boston" },
  { param: "address-city", label: "City",        placeholder: "Worcester" },
];

// FHIR string search is prefix match by default, so "Carr" finds "Carroll471".
const GENDERS = ["", "male", "female", "other", "unknown"];

// A date search is a comparator plus a value: birthdate=ge1980-01-01
const DATE_OPS = [
  { value: "eq", label: "on" },
  { value: "ge", label: "after" },
  { value: "le", label: "before" },
];

const PAGE_SIZE = 20;

function buildParams(form, offset) {
  const params = new URLSearchParams();
  for (const { param } of FIELDS) {
    const value = (form[param] || "").trim();
    if (value) params.append(param, value);
  }
  if (form.gender) params.append("gender", form.gender);
  // Only send birthdate when a date was actually picked; a bare comparator
  // would match nothing and look like a broken search.
  if (form.birthdate) params.append("birthdate", form.dateOp + form.birthdate);
  params.append("limit", String(PAGE_SIZE));
  params.append("offset", String(offset));
  return params;
}

function SearchForm({ form, setForm, onSubmit, onClear, busy }) {
  const set = (key) => (event) => setForm({ ...form, [key]: event.target.value });

  return (
    <form
      className="card"
      onSubmit={(event) => {
        event.preventDefault();
        onSubmit(0);
      }}
    >
      <div className="grid">
        {FIELDS.map(({ param, label, placeholder }) => (
          <div key={param}>
            <label htmlFor={param}>
              {label} <code>{param}</code>
            </label>
            <input
              id={param}
              value={form[param] || ""}
              onChange={set(param)}
              placeholder={placeholder}
              autoComplete="off"
            />
          </div>
        ))}

        <div>
          <label htmlFor="gender">
            Gender <code>gender</code>
          </label>
          <select id="gender" value={form.gender} onChange={set("gender")}>
            {GENDERS.map((g) => (
              <option key={g} value={g}>{g || "any"}</option>
            ))}
          </select>
        </div>

        <div>
          <label htmlFor="birthdate">
            Born <code>birthdate</code>
          </label>
          <div className="born">
            <select value={form.dateOp} onChange={set("dateOp")} aria-label="date comparator">
              {DATE_OPS.map((op) => (
                <option key={op.value} value={op.value}>{op.label}</option>
              ))}
            </select>
            <input id="birthdate" type="date" value={form.birthdate} onChange={set("birthdate")} />
          </div>
        </div>
      </div>

      <div className="actions">
        <button className="primary" type="submit" disabled={busy}>
          {busy ? "Searching..." : "Search"}
        </button>
        <button type="button" onClick={onClear} disabled={busy}>Clear</button>
        <span className="count">Leave everything blank to list all patients.</span>
      </div>

      <div className="query">GET /patients?{buildParams(form, 0).toString()}</div>
    </form>
  );
}

function Results({ page, selected, onSelect, offset, onPage, busy }) {
  if (!page) return null;
  if (page.total === 0) {
    return <div className="card"><div className="empty">No patients matched.</div></div>;
  }

  const from = offset + 1;
  const to = offset + page.count;
  return (
    <div className="card">
      <div className="bar">
        <span className="count">
          Showing {from}–{to} of {page.total}
        </span>
        <div className="pager">
          <button onClick={() => onPage(offset - PAGE_SIZE)} disabled={busy || offset === 0}>
            Previous
          </button>
          <button onClick={() => onPage(offset + PAGE_SIZE)} disabled={busy || to >= page.total}>
            Next
          </button>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Gender</th>
            <th>Born</th>
            <th className="hide-sm">MRN</th>
          </tr>
        </thead>
        <tbody>
          {page.patients.map((patient) => (
            <tr
              key={patient.id}
              className={selected && selected.id === patient.id ? "sel" : ""}
              onClick={() => onSelect(patient)}
            >
              <td>{patient.name || "(no name)"}</td>
              <td>{patient.gender || "-"}</td>
              <td>{patient.birth_date || "-"}</td>
              <td className="hide-sm mono">{patient.mrn || "-"}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function Detail({ patient, packet, onPacket, busy }) {
  if (!patient) return null;
  return (
    <div className="card">
      <h1 style={{ fontSize: 16, marginBottom: 14 }}>{patient.name || "(no name)"}</h1>
      <dl className="detail">
        <dt>Born</dt><dd>{patient.birth_date || "-"}</dd>
        <dt>Gender</dt><dd>{patient.gender || "-"}</dd>
        <dt>MRN</dt><dd className="mono">{patient.mrn || "-"}</dd>
        <dt>Source</dt><dd className="mono">{patient.source}</dd>
      </dl>
      <div className="actions">
        <button onClick={() => onPacket(patient.id)} disabled={busy}>
          Build clinical packet
        </button>
      </div>
      {packet && <div className="query">{packet}</div>}
    </div>
  );
}

const BLANK = { gender: "", birthdate: "", dateOp: "ge" };

function App() {
  const [form, setForm] = useState(BLANK);
  const [page, setPage] = useState(null);
  const [offset, setOffset] = useState(0);
  const [selected, setSelected] = useState(null);
  const [packet, setPacket] = useState(null);
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);

  const search = useCallback(
    async (nextOffset) => {
      setBusy(true);
      setError(null);
      setSelected(null);
      setPacket(null);
      try {
        const response = await fetch(`${API}/patients?${buildParams(form, nextOffset)}`);
        const body = await response.json();
        if (!response.ok) {
          // The API returns either a plain message or {message, supported}
          // when a parameter name is not one the FHIR server accepts.
          setError(body.detail || `HTTP ${response.status}`);
          setPage(null);
          return;
        }
        setPage(body);
        setOffset(nextOffset);
      } catch (err) {
        setError(`Could not reach the API: ${err.message}`);
        setPage(null);
      } finally {
        setBusy(false);
      }
    },
    [form]
  );

  const loadPacket = useCallback(async (patientId) => {
    setBusy(true);
    setPacket(null);
    try {
      const response = await fetch(`${API}/patients/${patientId}/packet`);
      const body = await response.json();
      setPacket(
        response.ok
          ? JSON.stringify(body, null, 2)
          : `HTTP ${response.status}: ${body.detail || "request failed"}`
      );
    } catch (err) {
      setPacket(`Could not reach the API: ${err.message}`);
    } finally {
      setBusy(false);
    }
  }, []);

  return (
    <div className="wrap">
      <header>
        <h1>Patient Search</h1>
        <div className="sub">
          Every field is a FHIR <code>Patient</code> search parameter. Blank fields are
          omitted, so any combination works.
        </div>
      </header>

      {error && (
        <div className="err">
          <strong>{error.message || String(error)}</strong>
          {error.supported && (
            <ul>
              {error.supported.slice(0, 24).map((name) => (
                <li key={name}>{name}</li>
              ))}
            </ul>
          )}
        </div>
      )}

      <SearchForm
        form={form}
        setForm={setForm}
        onSubmit={search}
        onClear={() => {
          setForm(BLANK);
          setPage(null);
          setSelected(null);
          setPacket(null);
          setError(null);
        }}
        busy={busy}
      />

      <Results
        page={page}
        selected={selected}
        onSelect={(patient) => {
          setSelected(patient);
          setPacket(null);
        }}
        offset={offset}
        onPage={search}
        busy={busy}
      />

      <Detail patient={selected} packet={packet} onPacket={loadPacket} busy={busy} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
