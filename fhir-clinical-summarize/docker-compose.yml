services:
  hapi-fhir:
    # Pinned so the demo doesn't change under us. The image is distroless (no shell/curl),
    # so readiness is checked from outside via GET /fhir/metadata instead of a healthcheck.
    image: hapiproject/hapi:v8.12.0-2
    container_name: hapi-fhir
    ports:
      - "8080:8080"
    environment:
      - spring.datasource.url=jdbc:postgresql://db:5432/hapi
      - spring.datasource.username=hapi
      - spring.datasource.password=hapi
      - spring.datasource.driverClassName=org.postgresql.Driver
      - spring.jpa.properties.hibernate.dialect=ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      - hapi.fhir.default_encoding=json
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:14
    container_name: hapi-postgres
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: hapi
    ports:
      # Published so a host uvicorn can reach the summary cache. The container is
      # reachable as db:5432 from inside the compose network, which is what the
      # prod overlay's api service uses -- this mapping is only for host access.
      #
      # 55432, not 5432: a native Postgres already owns the host's 5432 on this
      # machine, and it answers before Colima's forward does, so a host client
      # aiming at 5432 authenticates against the wrong server and fails with
      # "password authentication failed for user hapi" while HAPI itself is
      # perfectly happy on the internal network.
      - "55432:5432"
    volumes:
      - hapi-postgres-data:/var/lib/postgresql/data
      # Creates the `summaries` database, but only on a fresh volume -- see the
      # file for what an existing volume needs instead.
      - ./deploy/init-summaries.sql:/docker-entrypoint-initdb.d/10-summaries.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  hapi-postgres-data:
