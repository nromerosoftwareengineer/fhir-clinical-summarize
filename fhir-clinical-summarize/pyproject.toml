[project]
name = "fhir-clinical-summarize"
version = "0.1.0"
description = "Assembles a source-cited clinical packet from a FHIR server, summarized by a local LLM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Only needed when FHIR_AUTH_SCOPE is set, i.e. against a managed FHIR service
# that authenticates with Entra ID. A local HAPI container needs no auth, so the
# base install stays free of cloud SDKs.
azure = [
    "azure-identity>=1.17",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
